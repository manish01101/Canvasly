    environment:
      - DATABASE_URL=${DATABASE_URL}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_HTTP_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080

